# Regularization baseline: the wake-phase baseline plus dropout in the MLP head.
# Identical to baseline_fmnist.yaml except for `model.dropout`, which the sweep below varies.
# Report the value with the best mean val_acc (see experiments/summarize.py), not the best test_acc.
name: baseline_fmnist_dropout

data:
  name: fashion_mnist
  train_size: 2000      # balanced: 200 per class
  val_size: 5000        # drawn from training images that are not in the train subset
  root: data

model:
  arch: small_cnn
  width: 32
  hidden: 256
  dropout: 0.0          # set by the sweep

optim:
  name: adam
  lr: 0.001
  weight_decay: 0.0

train:
  epochs: 60
  batch_size: 64
  eval_batch_size: 1000
  log_every: 1

device: auto

sweep:
  model.dropout: [0.25, 0.5, 0.75]
