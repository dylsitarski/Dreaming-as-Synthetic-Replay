name: baseline_fmnist_dropout
data:
  name: fashion_mnist
  train_size: 2000
  val_size: 5000
  root: data
model:
  arch: small_cnn
  width: 32
  hidden: 256
  dropout: 0.25
optim:
  name: adam
  lr: 0.001
  weight_decay: 0.0
train:
  epochs: 60
  batch_size: 64
  eval_batch_size: 1000
  log_every: 1
device: auto
run: dropout=0.25
